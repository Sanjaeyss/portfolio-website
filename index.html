<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sanjaey Shunmuga Sundaram</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Sanjaey Shunmuga Sundaram, software engineer working on software engineering and AI. MS Computer Science at NC State.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- ?v= forces browsers to fetch fresh files after an update. Run ./bump-version.sh before pushing. -->
<link rel="stylesheet" href="styles.css?v=202610190231">
<script>
  try { var t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="#top" class="brand" id="brand"></a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#leadership">Leadership</a>
      <a href="#contact">Contact</a>
      <a href="#" class="nav-resume" id="nav-resume" target="_blank" rel="noopener">Resume ↗</a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="wrap hero">
    <div class="hero-text">
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <p class="hero-intro" id="hero-intro"></p>
      <div class="btn-row" id="hero-actions"></div>
    </div>
    <aside class="card glance" aria-label="At a glance">
      <div class="badge">
        <img id="photo" class="photo" src="" alt="" width="96" height="96">
        <div class="badge-text">
          <div class="badge-name" id="badge-name"></div>
          <div class="badge-sub" id="badge-sub"></div>
        </div>
      </div>
      <div class="cap glance-cap">At a glance</div>
      <dl class="glance-list" id="glance"></dl>
      <p class="status" id="status"></p>
    </aside>
  </section>

  <section class="wrap stats" id="stats" aria-label="Impact"></section>

  <section class="wrap section" id="experience">
    <div class="section-head">
      <h2 class="section-title">Experience</h2>
      <span class="hint">Click a role to collapse it</span>
    </div>
    <div class="jobs" id="jobs"></div>
  </section>

  <section class="wrap section" id="projects">
    <div class="section-head">
      <h2 class="section-title">Projects</h2>
      <span class="hint" id="project-count"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter projects"></div>
    <div class="cards" id="cards"></div>
    <article class="card case" id="case" aria-live="polite"></article>
  </section>

  <section class="wrap section two-col" id="leadership">
    <div>
      <h2 class="section-title">Leadership</h2>
      <dl class="timeline" id="lead"></dl>
    </div>
    <div>
      <h2 class="section-title">Skills</h2>
      <div id="skills"></div>
      <div class="cap label-accent edu-cap">Education</div>
      <div id="education"></div>
    </div>
  </section>

  <section class="wrap section two-col contact" id="contact">
    <div>
      <h2 class="contact-title" id="contact-title"></h2>
      <dl class="contact-list" id="contact-list"></dl>
    </div>
    <form class="contact-form" id="contact-form" novalidate>
      <div class="field-row">
        <div class="field">
          <label for="cf-name">Your name</label>
          <input id="cf-name" name="from_name" type="text" placeholder="Jordan Lee" required autocomplete="name">
        </div>
        <div class="field">
          <label for="cf-email">Your email</label>
          <input id="cf-email" name="reply_to" type="email" placeholder="jordan@company.com" required autocomplete="email">
        </div>
      </div>
      <div class="field">
        <label for="cf-subject">Subject</label>
        <input id="cf-subject" name="subject" type="text" placeholder="SWE role on our platform team" required>
      </div>
      <div class="field">
        <label for="cf-message">Message</label>
        <textarea id="cf-message" name="message" rows="5" placeholder="Hi Sanjaey, I came across your portfolio and..." required></textarea>
      </div>
      <!-- Spam trap: hidden from people, bots tend to tick it -->
      <input type="checkbox" name="botcheck" id="cf-botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" style="display:none">
      <div class="form-foot">
        <button type="submit" class="btn btn-primary" id="cf-submit">Send message →</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </div>
    </form>
  </section>
</main>

<footer class="wrap footer">
  <span id="footer-text"></span>
  <span class="footer-links" id="footer-links"></span>
</footer>

<script src="content.js?v=202610190231"></script>
<script src="script.js?v=202610190231"></script>
</body>
</html>
